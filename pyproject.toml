[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citewise-ai"
version = "0.1.0"
description = "Evidence-first local document search with inspectable citations."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.7,<2.0",
    "streamlit>=1.45,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
